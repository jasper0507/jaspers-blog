name: CI

on:
  pull_request:
    branches: [main]

env:
  BLOG_CONTENT_DIR: tests/fixtures/content

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          # ubuntu-26.04 的 /tmp 是独立 tmpfs；验收产物须与仓库同盘，Astro 构建才能 rename 资源。
          TMPDIR: ${{ runner.temp }}

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - run: npm run test:browser-smoke
        env:
          TMPDIR: ${{ runner.temp }}
